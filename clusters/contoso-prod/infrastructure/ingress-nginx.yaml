apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: ingress
  releaseName: ingress-nginx
  chart:
    spec:
      chart: ingress-nginx
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      replicaCount: 2
      service:
        annotations:
          # INTERNAL load balancer, deliberately. A public Service of type LoadBalancer allocates a
          # public IP, which the deny-public-ip policy in infra/subscription-policy.bicep blocks and
          # which no OT network should expose in the first place. Reach this through ExpressRoute,
          # VPN, or the Bastion host the sandbox architectures deploy.
          service.beta.kubernetes.io/azure-load-balancer-internal: "true"
        externalTrafficPolicy: Local
      # Spread replicas across zones so a single zone outage does not take ingress down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      metrics:
        enabled: true
      admissionWebhooks:
        enabled: true
